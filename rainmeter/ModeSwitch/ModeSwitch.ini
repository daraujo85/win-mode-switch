[Rainmeter]
Update=1000
Author=GhostHand
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
StateFile=%USERPROFILE%\scripts\current_mode.txt

;-------------------------------------------------------------
; MEASURE: Read current mode from text file
;-------------------------------------------------------------

[mCurrentMode]
Measure=WebParser
URL=file://#StateFile#
RegExp=(?si)^\s*([A-Za-z]+)
StringIndex=1
UpdateRate=1
IfMatch=GAMER
IfMatchAction=[!SetOption MeterModeStatus Text "● GAMER"][!SetOption MeterModeStatus FontColor "255,60,85,255"][!SetOption MeterBox Fill "Fill Color 38,14,20,230"][!SetOption MeterBox Stroke "Stroke Color 255,60,85,200"][!UpdateMeter *][!Redraw]
IfNotMatchAction=[!SetOption MeterModeStatus Text "● WORK"][!SetOption MeterModeStatus FontColor "0,245,190,255"][!SetOption MeterBox Fill "Fill Color 12,32,32,230"][!SetOption MeterBox Stroke "Stroke Color 0,245,190,200"][!UpdateMeter *][!Redraw]

;-------------------------------------------------------------
; VISUAL LAYOUT (Simplic 250px Width Style - Ultra Minimalist & Readable)
;-------------------------------------------------------------

[MeterTopLine]
Meter=IMAGE
X=0
Y=0
W=250
H=1
SolidColor=255,255,255,80

[MeterBox]
Meter=Shape
Shape=Rectangle 8,8,234,64,8 | Fill Color 15,20,28,230 | StrokeWidth 2 | Stroke Color 0,245,190,200
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "%USERPROFILE%\scripts\toggle_mode.ps1"]
ToolTipText="Clique para alternar entre MODO GAMER e MODO WORK"

[MeterIcon]
Meter=IMAGE
ImageName=#CURRENTPATH#icon.png
X=18
Y=16
W=48
H=48
AntiAlias=1

[MeterModeStatus]
Meter=String
FontFace=#FontFace#
FontColor=0,245,190,255
FontSize=18
StringStyle=Bold
X=78
Y=16
Text="● WORK"
AntiAlias=1

[MeterModeSub]
Meter=String
FontFace=#FontFace#
FontColor=180,200,220,200
FontSize=10
X=80
Y=44
Text="ALTERNAR ⇄"
AntiAlias=1

[MeterBottomLine]
Meter=IMAGE
X=0
Y=80
W=250
H=1
SolidColor=255,255,255,80
